name: Deploy demo to GitHub Pages

# Publishes the static inference demo in docs/ (baked by
# scripts/build_static_snapshot.py) to GitHub Pages. docs/ is committed, so this
# just uploads it as a Pages artifact — no Python/torch needed in CI.

on:
  push:
    branches: [top-down-branch]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
